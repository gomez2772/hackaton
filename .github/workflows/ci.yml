name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests (sin APIs de pago)
        run: python -m pytest -q

      - name: Pipeline en modo simulado
        run: python -m app.pipeline --fake

      - name: Propiedad de archivos
        if: github.event_name == 'pull_request'
        run: |
          EXTRA=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'contrato') }}" = "true" ]; then EXTRA="--allow-frozen"; fi
          python tools/check_ownership.py --base origin/${{ github.base_ref }} --branch "${{ github.head_ref }}" $EXTRA
